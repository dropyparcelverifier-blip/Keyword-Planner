<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AdBrain Worker</title>
  <style>
    :root {
      --bg-0:       #0b1020;
      --bg-1:       #0f1631;
      --bg-2:       #161e35;
      --bg-3:       #1d2742;
      --bg-input:   #0e1424;
      --line-1:     #1f2942;
      --line-2:     #2a3658;
      --text-0:     #f1f4fb;
      --text-1:     #d8dff0;
      --text-2:     #9aa6c3;
      --text-3:     #6b7799;
      --accent:     #5a8cff;
      --accent-2:   #3a6eee;
      --accent-soft: rgba(90,140,255,0.14);
      --success:    #34d399;
      --success-soft: rgba(52,211,153,0.10);
      --warn:       #fbbf24;
      --warn-soft:  rgba(251,191,36,0.10);
      --danger:     #f87171;
      --danger-soft: rgba(248,113,113,0.10);
      --info:       #60a5fa;
      --info-soft:  rgba(96,165,250,0.10);
      --mono: 'JetBrains Mono','Fira Code',Consolas,monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; background: var(--bg-0); color: var(--text-1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px; line-height: 1.5;
      min-width: 380px;
    }
    /* Header */
    .header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px;
      background: var(--bg-1); border-bottom: 1px solid var(--line-1);
    }
    .brand { font-weight: 700; font-size: 14px; color: var(--text-0); letter-spacing: 0.3px; }
    .brand .icon { color: var(--accent); }
    .spacer { flex: 1; }

    /* Status pill */
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 600;
      background: var(--bg-2); border: 1px solid var(--line-2); color: var(--text-2);
    }
    .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
    .pill.armed   { background: var(--info-soft); border-color: var(--info); color: var(--info); }
    .pill.armed .dot   { background: var(--info); animation: pulse 2s ease-in-out infinite; }
    .pill.running { background: var(--success-soft); border-color: var(--success); color: var(--success); }
    .pill.running .dot { background: var(--success); animation: pulse 1.2s ease-in-out infinite; }
    .pill.paused  { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
    .pill.paused .dot  { background: var(--warn); }
    .pill.stopped { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
    .pill.stopped .dot { background: var(--danger); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Body sections */
    .body { padding: 12px 14px; }
    .card {
      background: var(--bg-2); border: 1px solid var(--line-2);
      border-radius: 8px; margin-bottom: 10px;
    }
    .card-head {
      padding: 8px 12px; border-bottom: 1px solid var(--line-1);
      display: flex; align-items: center; gap: 8px;
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-2);
    }
    .card-body { padding: 8px 12px; }
    .kv {
      display: grid; grid-template-columns: 96px 1fr; gap: 4px 8px;
      font-size: 12px;
    }
    .kv .k { color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
    .kv .v { color: var(--text-1); font-family: var(--mono); font-size: 11px;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kv .v.wrap { white-space: normal; word-break: break-all; }
    .kv .v.muted { color: var(--text-3); }

    /* Buttons */
    .row-btns { display: flex; gap: 6px; }
    button {
      flex: 1; padding: 8px 10px; font-size: 12px; font-weight: 600;
      background: var(--bg-3); color: var(--text-1); border: 1px solid var(--line-2);
      border-radius: 6px; cursor: pointer; font-family: inherit;
      transition: all 120ms;
    }
    button:hover:not(:disabled) { background: var(--line-2); border-color: var(--line-2); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    button.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
    button.warn { background: var(--warn); color: var(--bg-0); border-color: var(--warn); }
    button.warn:hover:not(:disabled) { filter: brightness(1.1); }
    button.danger { background: var(--danger); color: white; border-color: var(--danger); }
    button.danger:hover:not(:disabled) { background: #d94040; border-color: #d94040; }

    /* Log */
    .log {
      max-height: 200px; overflow: auto;
      background: var(--bg-input); border: 1px solid var(--line-1);
      border-radius: 6px; padding: 6px 8px;
      font-family: var(--mono); font-size: 10px; line-height: 1.5;
    }
    .log-line { padding: 2px 0; border-bottom: 1px solid var(--line-1); color: var(--text-1); }
    .log-line:last-child { border-bottom: none; }
    .log-line.ok    { color: var(--success); }
    .log-line.warn  { color: var(--warn); }
    .log-line.err   { color: var(--danger); }
    .log-line .ts { color: var(--text-3); margin-right: 6px; }
    .log-empty { padding: 12px 4px; text-align: center; color: var(--text-3); font-size: 11px; }

    /* Footer */
    .footer {
      padding: 10px 14px;
      border-top: 1px solid var(--line-1);
      font-size: 11px; color: var(--text-3);
      display: flex; align-items: center; gap: 8px;
    }
    .footer a { color: var(--accent); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <span class="brand"><span class="icon">◆</span> AdBrain Worker</span>
    <span class="spacer"></span>
    <span class="pill" id="statusPill"><span class="dot"></span><span id="statusText">loading…</span></span>
  </div>

  <div class="body">
    <!-- Connection info -->
    <div class="card">
      <div class="card-head">Connection</div>
      <div class="card-body">
        <div class="kv">
          <div class="k">Manager</div>   <div class="v wrap" id="managerUrl" title="—">—</div>
          <div class="k">Worker ID</div> <div class="v" id="workerId">—</div>
          <div class="k">Health</div>    <div class="v" id="healthStatus">—</div>
        </div>
      </div>
    </div>

    <!-- Config applied from manager -->
    <div class="card">
      <div class="card-head">Effective Config</div>
      <div class="card-body">
        <div class="kv">
          <div class="k">KP URL</div>       <div class="v wrap" id="kpUrl" title="—">—</div>
          <div class="k">Match profile</div><div class="v" id="matchProfile">—</div>
          <div class="k">Batch</div>        <div class="v" id="currentBatch">—</div>
        </div>
      </div>
    </div>

    <!-- Today's throughput -->
    <div class="card">
      <div class="card-head">
        Today
        <span class="spacer"></span>
        <span id="dayResetLabel" style="font-size: 10px; color: var(--text-3); text-transform: none; letter-spacing: 0;">since midnight</span>
      </div>
      <div class="card-body" style="padding: 8px 12px;">
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center;">
          <div>
            <div style="font-size: 20px; font-weight: 700; color: var(--success);" id="todayDone">0</div>
            <div style="font-size: 9px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.4px;">Processed</div>
          </div>
          <div>
            <div style="font-size: 20px; font-weight: 700; color: var(--info);" id="todayKw">0</div>
            <div style="font-size: 9px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.4px;">Keywords</div>
          </div>
          <div>
            <div style="font-size: 20px; font-weight: 700; color: var(--text-1);" id="todayAvg">—</div>
            <div style="font-size: 9px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.4px;">Avg / SKU</div>
          </div>
        </div>
        <!-- Mini sparkline: rows/hour last 12h -->
        <div id="workerSparkline" style="display: flex; align-items: flex-end; gap: 2px; height: 24px; margin-top: 10px;"></div>
      </div>
    </div>

    <!-- Current run -->
    <div class="card">
      <div class="card-head">
        Current run
        <span class="spacer"></span>
        <span id="progressText" style="font-size: 11px; color: var(--text-2); text-transform: none; letter-spacing: 0;">—</span>
      </div>
      <div class="card-body">
        <div class="kv" style="margin-bottom: 8px;">
          <div class="k">Last action</div>
          <div class="v wrap" id="lastStatus">—</div>
        </div>
        <div class="row-btns">
          <button id="pauseBtn" title="Stop after current SKU">⏸ Pause</button>
          <button id="resumeBtn" title="Resume claiming work" class="primary">▶ Resume</button>
          <button id="stopBtn" title="Stop and disarm (needs manual restart)" class="danger">■ Stop</button>
        </div>
      </div>
    </div>

    <!-- Live log -->
    <div class="card">
      <div class="card-head">
        Live log
        <span class="spacer"></span>
        <button id="clearLogBtn" style="flex: 0; font-size: 10px; padding: 2px 8px;">Clear</button>
      </div>
      <div class="card-body" style="padding: 6px 8px;">
        <div class="log" id="workerLog"><div class="log-empty">No activity yet.</div></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="#" id="openManager">🖥️ Open manager dashboard</a>
    <span class="spacer"></span>
    <span id="lastRefresh" style="font-size: 10px;">—</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
