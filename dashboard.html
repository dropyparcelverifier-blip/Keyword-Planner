<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AdBrain Discovery — Operations Dashboard</title>
<style>
  :root {
    --bg:        #0a0d14;
    --bg-elev:   #11151f;
    --panel:    #1a2030;
    --panel-2:  #232a3c;
    --border:   #2a3349;
    --border-strong: #3a4565;
    --text:     #e8ecf3;
    --muted:    #8794ad;
    --muted-strong: #b3bdd1;
    --accent:   #4f8cff;
    --accent-hover: #6ba2ff;
    --accent-soft: rgba(79,140,255,0.18);
    --success:  #22c55e;
    --warn:     #f59e0b;
    --danger:   #ef4444;
    --info:     #3b82f6;
    --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 13px; height: 100vh; overflow: hidden; }
  button {
    font-family: inherit;
    padding: 6px 12px;
    font-size: 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--panel-2); border-color: var(--border-strong); }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.danger  { background: var(--danger); border-color: var(--danger); color: white; }
  button.danger:hover:not(:disabled)  { background: #fca5a5; color: #1a0d0d; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  code { font-family: 'SF Mono', Consolas, monospace; font-size: 0.92em; }

  /* ============ Layout ============ */
  .app {
    display: grid;
    grid-template-rows: 56px 1fr;
    grid-template-columns: 1fr;
    height: 100vh;
  }
  /* Header */
  header.appbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
  }
  .appbar-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .appbar-title .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .appbar-tag {
    font-size: 10px;
    padding: 2px 8px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
  }
  .appbar-batch-select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    font-family: 'SF Mono', Consolas, monospace;
    min-width: 200px;
  }
  .appbar-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11px;
    color: var(--muted);
  }
  .appbar-controls { display: flex; gap: 6px; }

  /* Main grid: left (overview + workers) + right (logs + failed) */
  main.dash {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 16px;
    padding: 16px;
    overflow: hidden;
    min-height: 0;
  }
  .col-left, .col-right {
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
    min-height: 0;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .card-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.15);
    flex-shrink: 0;
  }
  .card-icon { font-size: 16px; }
  .card-title { font-size: 12px; font-weight: 600; color: var(--text);
    text-transform: uppercase; letter-spacing: 0.5px; }
  .card-sub { font-size: 11px; color: var(--muted); margin-left: auto; }
  .card-body { padding: 14px; flex: 1; overflow: auto; min-height: 0; }
  .card-body.tight { padding: 10px 14px; }

  /* ============ Batch overview ============ */
  .batch-overview { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .batch-progress-row {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 6px; font-size: 12px;
  }
  .batch-progress-row .pct { color: var(--success); font-weight: 700; font-size: 18px; }
  .batch-progress-row .frac { color: var(--muted-strong); }
  .progress-bar { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--success), #16a34a); transition: width 0.4s ease; }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  .stat-tile {
    padding: 10px 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    text-align: center;
  }
  .stat-tile-value { font-size: 24px; font-weight: 700; color: var(--text); line-height: 1.05; }
  .stat-tile-label { font-size: 9px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 4px; }
  .stat-tile.pending  .stat-tile-value { color: var(--warn); }
  .stat-tile.claimed  .stat-tile-value { color: var(--info); }
  .stat-tile.done     .stat-tile-value { color: var(--success); }
  .stat-tile.failed   .stat-tile-value { color: var(--danger); }

  /* ============ Worker grid ============ */
  .worker-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
  }
  .worker-card {
    padding: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: border-color 0.2s;
  }
  .worker-card:hover { border-color: var(--border-strong); }
  .worker-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .worker-dot { width: 8px; height: 8px; border-radius: 50%; }
  .worker-dot.fresh    { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .worker-dot.amber    { background: var(--warn); }
  .worker-dot.stale    { background: var(--danger); }
  .worker-name { font-size: 13px; font-weight: 600; color: var(--text); flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .worker-hb   { font-size: 10px; color: var(--muted); }
  .worker-stats {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px;
    margin-bottom: 8px;
  }
  .worker-stat-v { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.05; }
  .worker-stat-v.done   { color: var(--success); }
  .worker-stat-v.flight { color: var(--info); }
  .worker-stat-v.failed { color: var(--danger); }
  .worker-stat-l { font-size: 9px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  .worker-current {
    font-size: 10px;
    color: var(--muted);
    padding: 6px 8px;
    background: var(--panel);
    border-radius: 4px;
    line-height: 1.35;
    word-break: break-word;
    border-left: 2px solid var(--accent);
  }
  .worker-current.idle { border-left-color: var(--muted); }
  .worker-controls { display: flex; gap: 4px; margin-top: 8px; }
  .worker-controls button { flex: 1; padding: 4px 8px; font-size: 10px; }

  /* ============ Failed jobs panel ============ */
  .failed-list { display: flex; flex-direction: column; gap: 6px; }
  .failed-row {
    padding: 8px 10px;
    background: rgba(239,68,68,0.04);
    border: 1px solid rgba(239,68,68,0.25);
    border-left: 3px solid var(--danger);
    border-radius: 6px;
    font-size: 11px;
  }
  .failed-row .name { font-weight: 600; color: var(--text); word-break: break-word; }
  .failed-row .meta { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .failed-row .meta strong { color: var(--text); }
  .failed-row .actions { display: flex; gap: 4px; margin-top: 6px; }
  .failed-row .actions button { padding: 3px 8px; font-size: 10px; }

  /* ============ Activity log ============ */
  .log-filters {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-elev);
    flex-shrink: 0;
  }
  .log-filter {
    padding: 4px 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
  }
  .log-filter.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .log-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 14px;
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 11px;
    line-height: 1.5;
    min-height: 0;
  }
  .log-line {
    display: grid;
    grid-template-columns: 60px 80px 70px 1fr;
    gap: 8px;
    padding: 3px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .log-line .ts     { color: var(--muted); font-size: 10px; padding-top: 1px; }
  .log-line .worker { color: var(--accent); font-size: 10px; padding-top: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log-line .src    { font-size: 9px; padding: 1px 5px; border-radius: 3px;
    background: var(--panel); color: var(--muted-strong);
    text-align: center; height: 14px;
    text-transform: uppercase; letter-spacing: 0.3px; }
  .log-line .msg    { color: var(--text); word-break: break-word; }
  .log-line.level-ok   .msg { color: var(--success); }
  .log-line.level-err  .msg { color: var(--danger); }
  .log-line.level-warn .msg { color: var(--warn); }

  /* ============ Empty / loading states ============ */
  .empty {
    padding: 32px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
  .err-banner {
    margin: 16px;
    padding: 12px 16px;
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: 8px;
    color: var(--text);
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="appbar-title">
      <span class="dot"></span>
      AdBrain Discovery <span class="appbar-tag">Operations</span>
    </div>
    <select class="appbar-batch-select" id="batchSelect">
      <option value="">All batches</option>
    </select>
    <div class="appbar-status">
      <span id="lastRefresh">—</span>
      <span>·</span>
      <span id="autoRefreshLabel">auto-refresh: 5s</span>
    </div>
    <div class="appbar-controls">
      <button id="refreshBtn">Refresh now</button>
      <button id="releaseStaleBtn">Release stale (&gt; 10 min)</button>
      <button id="stopAllBtn" class="danger">Stop all workers</button>
    </div>
  </header>

  <main class="dash">
    <div class="col-left">
      <!-- Batch overview -->
      <div class="card">
        <div class="card-head">
          <span class="card-icon">📊</span>
          <span class="card-title">Batch overview</span>
          <span class="card-sub" id="batchSubLabel">no batch selected</span>
        </div>
        <div class="card-body tight">
          <div id="batchOverview" class="batch-overview">
            <div class="empty">Pick a batch above or upload one from the side-panel Queue tab.</div>
          </div>
        </div>
      </div>

      <!-- Worker grid -->
      <div class="card" style="flex: 1; min-height: 0;">
        <div class="card-head">
          <span class="card-icon">🖥️</span>
          <span class="card-title">Worker fleet</span>
          <span class="card-sub" id="workerCountLabel">—</span>
        </div>
        <div class="card-body">
          <div id="workerGrid" class="worker-grid">
            <div class="empty" style="grid-column: 1/-1;">No workers active yet.</div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-right">
      <!-- Failed jobs -->
      <div class="card">
        <div class="card-head">
          <span class="card-icon">⚠️</span>
          <span class="card-title">Failed jobs</span>
          <span class="card-sub" id="failedCountLabel">0</span>
        </div>
        <div class="card-body tight" style="max-height: 280px;">
          <div id="failedList" class="failed-list">
            <div class="empty">No failures yet.</div>
          </div>
        </div>
      </div>

      <!-- Activity log -->
      <div class="card" style="flex: 1; min-height: 0;">
        <div class="card-head">
          <span class="card-icon">📡</span>
          <span class="card-title">Live activity</span>
          <span class="card-sub" id="logCountLabel">—</span>
        </div>
        <div class="log-filters">
          <div class="log-filter active" data-level="all">All</div>
          <div class="log-filter" data-level="ok">OK</div>
          <div class="log-filter" data-level="warn">Warn</div>
          <div class="log-filter" data-level="err">Err</div>
        </div>
        <div id="logList" class="log-list">
          <div class="empty">Activity log is empty for this batch.</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="dashboard.js"></script>
</body>
</html>
